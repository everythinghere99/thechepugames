<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tactical War</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Floating UI Overlays -->
        <div id="top-ui">
            <div class="stat">❤️ <span id="health">100</span></div>
            <div class="stat">💰 <span id="gold">200</span></div>
            <div class="stat">🗺️ <span id="wave">Wave 1/5</span></div>
        </div>

        <div id="announcer" class="hidden">WAVE 1 START!</div>

        <div id="terminal-panel">
            <button id="btn-basic" class="active">Basic<span>20</span></button>
            <button id="btn-heavy">Heavy<span>40</span></button>
            <button id="btn-slow">Slow<span>50</span></button>
            <button id="btn-buff">Antenna<span>60</span></button>
        </div>

        <div id="overlay">
            <h1 id="overlay-title">Loading...</h1>
            <p id="overlay-desc"></p>
            <button id="overlay-btn" class="hidden">START MISSION</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
